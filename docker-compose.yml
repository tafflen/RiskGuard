services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: riskguard
      POSTGRES_USER: riskguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - riskguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskguard -d riskguard"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-test:
    image: postgis/postgis:16-3.4
    profiles: ["test"]
    environment:
      POSTGRES_DB: riskguard_test
      POSTGRES_USER: riskguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskguard -d riskguard_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  riskguard_postgres_data:
